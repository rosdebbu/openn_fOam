[package]
name = "openzess-wasm"
version = "0.1.0"
edition = "2021"
authors = ["OpenZess Team"]
description = "In-Browser WebAssembly Navier-Stokes CFD Solver for OpenZess Studio"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

